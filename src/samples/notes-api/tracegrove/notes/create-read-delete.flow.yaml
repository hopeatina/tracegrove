title: Create a note, read it back, deny a stranger, delete it and keep other notes intact
risk: critical
tags: [notes, authz]
given:
  existing: existing-note
steps:
  - name: create
    POST: /notes
    json: { title: Fresh note, body: Written through the real API. }
    expect: { status: 201 }
    save: { noteId: note.id }

  - name: read back
    GET: /notes/{noteId}
    observe: true
    expect: { status: 200, json: { note.title: Fresh note, note.body: Written through the real API. } }

  - name: intruder is denied
    GET: /notes/{noteId}
    as: intruder
    expect: { status: 403, absent: [note] }

  - name: delete
    DELETE: /notes/{noteId}
    expect: 204

  - name: gone
    GET: /notes/{noteId}
    observe: true
    expect: 404

  - name: existing note untouched
    GET: /notes/{existing.noteId}
    observe: true
    expect: { status: 200, json: { note.title: Existing note } }
