title: Discover asks the agent about routing it cannot read, and keeps the answer only once a run proves it
risk: critical
tags: [ui, browser, discover, agent]
browser:
  allowPaths: [/]
  allowMethods: [GET, HEAD, POST]
  maxActions: 1000
steps:
  - name: open the UI
    browser: { kind: navigate, path: / }
    expect: { status: 200 }
  - name: open discover
    browser: { kind: click, target: { by: role, role: button, name: Discover } }
  - name: the unreadable routing is named
    browser: { kind: read, target: { by: testId, name: ambiguities } }
    expect: { text: "Needs a decision1 place discovery cannot readunreadableapp/app.mjs:36 uses pattern-matched node:http paths, which the static scan cannot read.Ask ClaudeThe agent reads the code and writes flows; tracegrove runs them and keeps only what the app actually served." }
  - name: ask the agent
    browser: { kind: click, target: { by: role, role: button, name: Ask Claude } }
  - name: the draft was run, repaired once and proven
    browser: { kind: read, target: { by: testId, name: draft-files } }
    expect: { text: "proventracegrove/discovered/notes/update-not-allowed.flow.yamlPruneserved GET /notes/{id}, POST /notes, PUT /notes/{id}" }
    timeoutMs: 60000
