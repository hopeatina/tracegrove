title: Discover grows a feature branch as a tree, traces it against its spec and proves it with the branch's own flows
risk: critical
tags: [ui, browser, discover, grow]
browser:
  allowPaths: [/]
  allowMethods: [GET, HEAD, POST]
  maxActions: 1000
steps:
  - name: open the UI
    browser: { kind: navigate, path: / }
    expect: { status: 200 }
  - name: open discover
    browser: { kind: click, target: { by: role, role: button, name: Discover } }
  - name: pick the feature branch
    browser: { kind: click, target: { by: role, role: button, name: notes-count } }
  - name: the start card names the branch
    browser: { kind: read, target: { by: testId, name: grow-go } }
    expect: { text: Grow notes-count }
  - name: trace with the rules only, so the run is free and repeatable
    browser: { kind: click, target: { by: testId, name: grow-agent } }
  - name: grow it
    browser: { kind: click, target: { by: testId, name: grow-go } }
  - name: nothing runs until a mode is chosen
    browser: { kind: read, target: { by: testId, name: grow-mode-hint } }
    expect: { text: "Choose how much to prove. Tracing is done; nothing runs until you pick." }
    timeoutMs: 30000
  - name: each mode says how many scenarios it proves
    browser: { kind: read, target: { by: testId, name: grow-modes } }
    expect: { text: "Minimum · 2each critical journey end to end, its riskiest guard or failure, and every spec criterionStandard · 3adds the other journeys, and the other ways each one can failMax · 3adds every part on its own, and regression of the flows the change reaches" }
  - name: choose minimum
    browser: { kind: click, target: { by: testId, name: grow-mode-min } }
  - name: every criterion is proved by a passing flow
    browser: { kind: read, target: { by: testId, name: grow-result } }
    expect: { text: "2 of 2 scenarios provedSpec: 3 of 3 criteria proved, 0 need you. Log: .tracegrove/discovery/notes-count.jsonlOpen the runs" }
    timeoutMs: 60000
  - name: switch the tree to its outline
    browser: { kind: click, target: { by: testId, name: grow-view-outline } }
  - name: the outline leads with the end-to-end journey the tree draws, not a file
    browser: { kind: read, target: { by: testId, name: grow-ol-title-1 } }
    expect: { text: "GET /notes/count returns how many notes the caller ownsfrom the spec" }
