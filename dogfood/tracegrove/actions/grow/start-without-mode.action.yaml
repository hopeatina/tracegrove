title: Discover starts a grow with rules only and waits at the mode prompt, and hands back the waiting grow's id
inputs:
  branch: notes-count
outputs: [runId]
routes:
  - GET /
  - POST /api/grow
  - GET /api/run-control
sources:
  - src/authoring/ui.ts
  - src/authoring/uiGrove.ts
steps:
  - name: open the UI
    browser: { kind: navigate, path: / }
    expect: { status: 200 }
  - name: open discover
    browser: { kind: click, target: { by: role, role: button, name: Discover } }
  - name: pick the branch
    browser: { kind: click, target: { by: role, role: button, name: "{branch}" } }
  - name: trace with the rules only, so the run is free and repeatable
    browser: { kind: click, target: { by: testId, name: grow-agent } }
  - name: grow it
    browser: { kind: click, target: { by: testId, name: grow-go } }
  - name: tracing is done and the grow waits for a mode
    browser: { kind: read, target: { by: testId, name: grow-mode-hint } }
    expect: { text: "Choose how much to prove. Tracing is done; nothing runs until you pick." }
    timeoutMs: 30000
  - name: the waiting grow holds the lock
    GET: /api/run-control
    expect: { status: 200, json: { operation: grow } }
    save: { runId: runId }
