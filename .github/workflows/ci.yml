name: tracegrove
on:
  # Branches with an open PR are tested once, by the pull_request event; push only covers the main branch.
  push:
    branches: [codex/bootstrap]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # The repository variable CI_RUNNER (a JSON label list, e.g. ["tracegrove-mini","linux-arm64"]) moves this job
    # to a self-hosted runner; unset, it runs hosted. Fork pull requests always run hosted.
    # Setup: docs/self-hosted-runner.md
    runs-on: ${{ (vars.CI_RUNNER != '' && github.event.pull_request.head.repo.fork != true) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Python samples (FastAPI, Django)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r src/samples/fastapi-notes/requirements.txt -r src/samples/django-notes/requirements.txt
          echo "TRACEGROVE_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install pinned Chromium and system dependencies for real UI tests
        # The self-hosted VM has Chromium's system libraries preinstalled and its runner user has no sudo.
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then npx --no-install playwright install chromium
          else npx --no-install playwright install --with-deps chromium; fi
      - run: npm run verify
      - run: npm run test:conformance
      - run: npm run build
      - name: README first-use journey and verified cleanup
        id: readme-onboarding
        run: npm run test:onboarding
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.readme-onboarding.outcome != 'skipped'
        with:
          name: readme-onboarding
          path: artifacts/qa/readme-onboarding/
          if-no-files-found: warn
      - name: Verify immutable source resolution through the built CLI
        env:
          WORKFLOW_VERIFY_TEST_CLI: compiled
          TRACEGROVE_SOURCE_PROOF_DIR: ${{ runner.temp }}/source-regression-proof
        run: npm test -- tests/cliGitSources.test.ts tests/cliGitSnapshot.test.ts tests/typed-authoring.test.ts --maxWorkers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-regression-proof
          path: ${{ runner.temp }}/source-regression-proof/
          if-no-files-found: ignore
      - name: Qualify clean native and mocked Docker lanes
        id: container-qualification
        # The self-hosted runner has no Docker; the containers job below covers these lanes there.
        if: runner.environment == 'github-hosted'
        run: |
          npm run test:container -- native-real
          npm run test:container -- offline-contract
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.container-qualification.outcome != 'skipped'
        with:
          name: container-qualification
          path: artifacts/qa/container-*
          if-no-files-found: error
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install hash-locked Django customer environment
        run: |
          python -m venv "$RUNNER_TEMP/django"
          "$RUNNER_TEMP/django/bin/python" -m pip install --require-hashes -r src/samples/notes-django/app/requirements.lock
      - name: Replay shared corpus against Django without a database
        env:
          TRACEGROVE_DJANGO_PYTHON: ${{ runner.temp }}/django/bin/python
        run: npm run test:django
      - name: Zero-OrgX sample from the built distribution
        run: |
          node dist/cli/main.js sample-config --sample notes-api --output "$RUNNER_TEMP/notes"
          node dist/cli/main.js plan --config "$RUNNER_TEMP/notes/verification/workflow.yaml" --output "$RUNNER_TEMP/out/request.json"
          node dist/cli/main.js run --request "$RUNNER_TEMP/out/request.json" --json | tee "$RUNNER_TEMP/out/run.json"
          exec_id=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).executionId)" "$RUNNER_TEMP/out/run.json")
          node dist/cli/main.js export --execution "$exec_id" --state-dir "$RUNNER_TEMP/notes/verification/.workflow-verify" --output "$RUNNER_TEMP/out/bundle"
          node dist/cli/main.js verify-bundle --bundle "$RUNNER_TEMP/out/bundle"
      - name: tracegrove test from the built distribution
        run: |
          node dist/cli/main.js sample-config --sample notes-api --output "$RUNNER_TEMP/notes-flows"
          cd "$RUNNER_TEMP/notes-flows" && node "$GITHUB_WORKSPACE/dist/cli/main.js" test
      - name: Authenticated browser sample from the built distribution
        run: |
          node dist/cli/main.js sample-config --sample notes-browser --output "$RUNNER_TEMP/browser-sample"
          node dist/cli/main.js plan --config "$RUNNER_TEMP/browser-sample/verification/workflow.yaml" --output "$RUNNER_TEMP/browser-request.json"
          node dist/cli/main.js run --request "$RUNNER_TEMP/browser-request.json" --json > "$RUNNER_TEMP/browser-run.json"
          browser_execution=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).executionId)" "$RUNNER_TEMP/browser-run.json")
          node dist/cli/main.js export --execution "$browser_execution" --state-dir "$RUNNER_TEMP/browser-sample/verification/.workflow-verify" --output "$RUNNER_TEMP/browser-bundle"
          node dist/cli/main.js verify-bundle --bundle "$RUNNER_TEMP/browser-bundle"
          node dist/cli/main.js test --config "$RUNNER_TEMP/browser-sample/tracegrove.config.yaml" --grep notes.browser
      - name: Persisted async jobs from the built distribution
        run: |
          node dist/cli/main.js sample-config --sample report-jobs --output "$RUNNER_TEMP/jobs-sample" --json > "$RUNNER_TEMP/jobs-sample.json"
          jobs_config=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).config)" "$RUNNER_TEMP/jobs-sample.json")
          node dist/cli/main.js plan --config "$jobs_config" --profile real --output "$RUNNER_TEMP/jobs-request.json"
          node dist/cli/main.js run --request "$RUNNER_TEMP/jobs-request.json" --state-dir "$RUNNER_TEMP/jobs-state" --json > "$RUNNER_TEMP/jobs-run.json"
          jobs_execution=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).executionId)" "$RUNNER_TEMP/jobs-run.json")
          node dist/cli/main.js export --execution "$jobs_execution" --state-dir "$RUNNER_TEMP/jobs-state" --output "$RUNNER_TEMP/jobs-bundle"
          node dist/cli/main.js verify-bundle --bundle "$RUNNER_TEMP/jobs-bundle"
          node dist/cli/main.js test --config "$RUNNER_TEMP/jobs-sample/tracegrove.config.yaml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: async-job-evidence-bundle
          path: |
            ${{ runner.temp }}/jobs-bundle
            ${{ runner.temp }}/jobs-run.json
            ${{ runner.temp }}/jobs-sample/.tracegrove/runs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence-bundle
          path: |
            ${{ runner.temp }}/browser-bundle
            ${{ runner.temp }}/browser-sample/.tracegrove/runs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tracegrove-run
          path: ${{ runner.temp }}/notes-flows/.tracegrove/runs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-bundle
          path: ${{ runner.temp }}/out/bundle
          if-no-files-found: ignore
  containers:
    # Docker lanes stay on a hosted runner when verify runs self-hosted (the shared VM's Docker belongs to other jobs).
    if: vars.CI_RUNNER != '' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Qualify clean native and mocked Docker lanes
        id: container-qualification
        run: |
          npm run test:container -- native-real
          npm run test:container -- offline-contract
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.container-qualification.outcome != 'skipped'
        with:
          name: container-qualification
          path: artifacts/qa/container-*
          if-no-files-found: error
