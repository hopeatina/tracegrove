name: proof card
on:
  pull_request:
concurrency:
  group: proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  proof:
    runs-on: ${{ (vars.CI_RUNNER != '' && github.event.pull_request.head.repo.fork != true) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for the UI self-test
        # The self-hosted VM has Chromium's system libraries preinstalled and its runner user has no sudo.
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then npx --no-install playwright install chromium
          else npx --no-install playwright install --with-deps chromium; fi
      - run: npm run build
      - name: Run the examples and tracegrove's own UI self-test
        run: |
          for example in voice-receptionist vet-receptionist support-chatbot saas-billing clinic-portal notes-api notes-mcp report-jobs; do
            node dist/cli/main.js try "$example" --out "proof/$example" --no-open || true
          done
          node dist/cli/main.js test --config dogfood || true
      - uses: ./
        with:
          run: 'false'
          tracegrove: node dist/cli/main.js
          title: tracegrove on this PR
          directories: |
            proof/voice-receptionist
            proof/support-chatbot
            proof/notes-api
            proof/notes-mcp
            proof/report-jobs
            dogfood
